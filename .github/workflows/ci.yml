name: Foundation checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayos_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: relayos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relayos_test -d relayos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://relayos_test:ci-only-password@127.0.0.1:5432/relayos_test
      TEST_DATABASE_URL: postgresql://relayos_test:ci-only-password@127.0.0.1:5432/relayos_test
      RELAYOS_DISPOSABLE_TEST_DB: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm run build
