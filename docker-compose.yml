services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayos
      POSTGRES_USER: relayos
      POSTGRES_PASSWORD: local-only-password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - relayos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relayos']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  relayos-pg:
